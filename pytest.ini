[pytest]
testpaths =
    tests
python_files =
    test_*.py
pythonpath =
    .
addopts =
    --import-mode=importlib
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\.:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
markers =
    integration: bounded multi-component integration tests
    real_data: tests requiring the local DataSense release
    regression: scientific or closure regression tests
